name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: ${{ matrix.php-version == '8.4' && 'pcov' || 'none' }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Node Dependencies
        run: npm ci

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate Composer Metadata
        run: composer validate --strict

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Type Analysis
        run: composer types:check

      - name: Audit PHP Dependencies
        run: composer audit --locked --no-interaction

      - name: Audit Node Dependencies
        run: npm audit --audit-level=high

      - name: Verify Release State
        run: composer release:verify

      - name: Run Tests
        if: matrix.php-version != '8.4'
        run: php artisan test --compact

      - name: Run Tests And Publish Coverage Baseline
        if: matrix.php-version == '8.4'
        shell: bash
        run: |
          set -o pipefail
          php artisan test --compact --coverage | tee coverage.txt
          {
            echo '### PHP coverage baseline'
            echo '```text'
            tail -n 35 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Baseline
        if: matrix.php-version == '8.4'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-coverage-baseline
          path: coverage.txt
          if-no-files-found: error
          retention-days: 30

  ci-gate:
    name: ci-gate
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Confirm PHP Matrix Passed
        env:
          MATRIX_RESULT: ${{ needs.ci.result }}
        run: test "$MATRIX_RESULT" = "success"
